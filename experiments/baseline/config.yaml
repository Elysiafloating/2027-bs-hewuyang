# Baseline 实验配置（YOLOv8n 默认超参，验证整条流程）
# 对应 experiments/baseline/

experiment_id: EXP-000
name: baseline

model:
  arch: yolov8n          # nano，弱小目标基线
  pretrained: yolov8n.pt

data:
  yaml: configs/data.yaml   # UAEMMN：meteor + star 两类
  # 数据划分在 data.yaml 的 train/val 路径中定义

training:
  epochs: 100
  imgsz: 640
  batch: 16
  optimizer: auto          # SGD/Adam 自动
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  close_mosaic: 10         # 末 10 epoch 关 mosaic
  seed: 42
  deterministic: true
  device: 0                # GPU；CPU 改 -1

note: >
  基线均不引入任何改进。重点观察 star 类 Recall 是否≈0，
  并在 notes.md 中记录根因分析（标注尺度 / 类别不平衡 / anchor 匹配）。
